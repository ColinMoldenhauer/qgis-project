[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "qgis-project"
dynamic = ["version"]
description = "Create QGIS projects programmatically using Python"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["qgis", "gis", "geospatial", "mapping", "cartography"]
authors = [
  { name = "Colin Moldenhauer", email = "colin.moldenhauer@posteo.de" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: GIS",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = []

# QGIS is not on PyPI and must be installed separately.
# Recommended: install via conda-forge (`conda install -c conda-forge qgis`)
# or use the bundled Python interpreter from a QGIS desktop installation.
[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "mypy>=1.0.0",
  "numpy",
  "netCDF4",  # builds the multi-variable NetCDF test fixture
]
docs = [
  "mkdocs-material",
  "mkdocstrings[python]",
]

[project.urls]
Documentation = "https://github.com/ColinMoldenhauer/qgis-project#readme"
Issues = "https://github.com/ColinMoldenhauer/qgis-project/issues"
Source = "https://github.com/ColinMoldenhauer/qgis-project"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/qgis_project/__about__.py"

[tool.hatch.envs.default]
dependencies = [
  "coverage[toml]>=6.5",
  "pytest",
  "numpy",
  "netCDF4",
]
[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = [
  "- coverage combine",
  "coverage report",
]
cov = [
  "test-cov",
  "cov-report",
]

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/qgis_project tests}"

[tool.pytest.ini_options]
markers = [
  "qgis: requires QGIS importable in this Python process (Strategy 1 or 3)",
  "launcher: requires a standalone QGIS launcher (python-qgis.bat / Strategy 2)",
]

[tool.coverage.run]
source_pkgs = ["qgis_project", "tests"]
branch = true
parallel = true
omit = [
  "src/qgis_project/__about__.py",
]

[tool.coverage.paths]
qgis_project = ["src/qgis_project", "*/qgis-project/src/qgis_project"]
tests = ["tests", "*/qgis-project/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
