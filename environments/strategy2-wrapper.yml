# Strategy 2 — subprocess execution wrapper (QGIS_PROJECT_LAUNCH_MODE=local)
#
# This environment runs ONLY your Python code that builds the layer spec and
# then shells out to a separately-installed *standalone* QGIS via its bundled
# launcher (python-qgis.bat / python-qgis.sh). All the heavy GIS work happens
# in the QGIS-bundled Python, so this env stays deliberately minimal — no qgis,
# no GDAL, no Qt. The Python version here is unconstrained.
#
# Prerequisite: a standalone QGIS desktop install on this machine. If it is not
# auto-detected, set QGIS_PREFIX_PATH. Force this mode with QGIS_PROJECT_LAUNCH_MODE=local.
#
# Create from the repo root:  conda env create -f environments/strategy2-wrapper.yml
name: qgis-project-wrapper
channels:
  - conda-forge
dependencies:
  - python >=3.9
  - pip
  - pip:
      # The package itself (it has no runtime dependencies of its own).
      # Swap for "qgis-project" once published to PyPI.
      - -e .
