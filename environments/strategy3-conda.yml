# Strategy 3 — QGIS from conda-forge, in-process (QGIS_PROJECT_LAUNCH_MODE=env)
#
# The recommended setup. conda-forge installs a `qgis` package whose Python
# bindings are compiled for THIS environment's Python, so `import qgis` just
# works and Project() runs in-process — no version-matching dance, no DLL
# preloading. qgis pulls in Qt5/PyQt, GDAL, PROJ, etc. automatically.
#
# Create from the repo root:  conda env create -f environments/strategy3-conda.yml
name: qgis-project-conda
channels:
  - conda-forge
dependencies:
  - python >=3.9
  - qgis            # pin to a known-good release if desired, e.g. qgis=3.34
  - pip
  - pip:
      # Install the package without re-pulling deps already provided by conda.
      - --no-deps
      - -e .
