name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:

  # --------------------------------------------------------------------------
  # Pure-Python unit tests — no QGIS required.
  # Covers: Layer/RasterLayer/Style, _spec serialization, _env path detection.
  # --------------------------------------------------------------------------
  unit:
    name: Unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and dev deps
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/ -m "not qgis and not launcher" -v

  # --------------------------------------------------------------------------
  # Integration tests — QGIS via conda-forge (Strategy 3).
  # Covers: Project creation, add_layer, save, style application.
  # --------------------------------------------------------------------------
  integration-conda:
    name: Integration (Strategy 3, ${{ matrix.os }}, QGIS ${{ matrix.qgis }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        qgis: ["3.28", "3.34", "3.40"]
        exclude:
          # Reduce matrix: only run LTR + latest on each platform
          - os: windows-latest
            qgis: "3.34"
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: qgis-test
          channels: conda-forge,defaults

      - name: Install QGIS ${{ matrix.qgis }} and deps
        shell: bash -l {0}
        run: |
          mamba install -y "qgis=${{ matrix.qgis }}.*" numpy loguru
          pip install -e ".[dev]"

      - name: Run integration tests
        shell: bash -l {0}
        run: pytest tests/ -m qgis -v
        env:
          QT_QPA_PLATFORM: offscreen

  # --------------------------------------------------------------------------
  # Integration tests — standalone QGIS via apt (Strategy 1, Linux).
  #
  # python3-qgis installs QGIS Python bindings into the system Python
  # (Python 3.10 on Ubuntu 22.04).  A venv with --system-site-packages
  # inherits those bindings, so import qgis succeeds without conda.
  # QT_QPA_PLATFORM=offscreen prevents Qt from requiring a display.
  # --------------------------------------------------------------------------
  integration-standalone-linux:
    name: Integration (Strategy 1, Linux apt, QGIS ${{ matrix.qgis_suite }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - qgis_suite: ltr    # tracks the current LTR release
            apt_repo: ubuntu-ltr
          - qgis_suite: latest
            apt_repo: ubuntu
    steps:
      - uses: actions/checkout@v4

      - name: Add QGIS apt repository
        run: |
          sudo wget -qO /etc/apt/keyrings/qgis-archive-keyring.gpg \
            https://download.qgis.org/downloads/qgis-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/qgis-archive-keyring.gpg] \
            https://qgis.org/${{ matrix.apt_repo }} jammy main" \
            | sudo tee /etc/apt/sources.list.d/qgis.list
          sudo apt-get update -qq

      - name: Install QGIS and Python bindings
        run: sudo apt-get install -y qgis python3-qgis

      - name: Create venv inheriting system QGIS bindings
        run: python3 -m venv --system-site-packages .venv

      - name: Install package into venv
        run: |
          .venv/bin/pip install --upgrade pip packaging
          .venv/bin/pip install -e ".[dev]"

      - name: Run Strategy 1 integration tests
        run: .venv/bin/pytest tests/ -m qgis -v
        env:
          QT_QPA_PLATFORM: offscreen

  # --------------------------------------------------------------------------
  # Integration tests — standalone QGIS via Chocolatey (Strategy 2, Windows).
  #
  # Chocolatey installs the same OSGeo4W-based standalone installer used by
  # end-users, including python-qgis.bat.  SubprocessProject delegates to
  # that bat, so the test Python version is irrelevant — the subprocess runs
  # entirely inside QGIS's own bundled Python.
  #
  # Approximate times: Chocolatey download + install ~10–15 min.
  # The installer is cached between runs to speed up subsequent jobs.
  # --------------------------------------------------------------------------
  integration-standalone-windows:
    name: Integration (Strategy 2, Windows Chocolatey, QGIS ${{ matrix.qgis_pkg }})
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        qgis_pkg: [qgis-ltr, qgis]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Chocolatey packages
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\Temp\chocolatey
          key: choco-${{ matrix.qgis_pkg }}-${{ runner.os }}

      - name: Install QGIS via Chocolatey
        run: choco install ${{ matrix.qgis_pkg }} -y --no-progress
        shell: powershell

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # any version — subprocess uses QGIS's Python

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Diagnose QGIS install
        run: |
          python -c "
          import importlib.util, os
          from pathlib import Path
          pf = Path(os.environ.get('PROGRAMFILES', r'C:\Program Files'))
          print('PROGRAMFILES:', pf)
          for d in sorted(pf.glob('QGIS*')):
              print('  dir:', d)
              apps = d / 'apps'
              if apps.exists():
                  print('  apps/', [x.name for x in apps.iterdir() if x.is_dir()])
              bin_ = d / 'bin'
              if bin_.exists():
                  print('  bin/*.bat:', [x.name for x in bin_.glob('python*.bat')])
          spec = importlib.util.spec_from_file_location('_env', 'src/qgis_project/_env.py')
          _env = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(_env)
          try: print('prefix:', _env.find_qgis_prefix_path())
          except RuntimeError as e: print('prefix error:', e)
          print('launcher:', _env.find_qgis_launcher())
          "

      - name: Run Strategy 2 tests (subprocess)
        run: |
          pytest tests/ -m launcher -v
          $ec = $LASTEXITCODE
          # Exit 5 means no tests collected (launcher not found) — treat as success.
          if ($ec -eq 5) { exit 0 } else { exit $ec }
        env:
          QT_QPA_PLATFORM: offscreen
