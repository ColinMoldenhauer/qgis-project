name: qgis_dev
# Minimal spec — let conda-forge resolve compatible versions.
# Create:   conda env create -f environment.yml
# Update:   conda env update -f environment.yml --prune
channels:
  - conda-forge
  - defaults
dependencies:
  # Core
  - python=3.12
  - qgis>=3.34          # LTR or later; conda-forge resolves latest available
  - numpy

  # Jupyter
  - ipykernel           # register this env as a Jupyter kernel
  - jupyterlab          # notebook server — comment out if unneeded

  # Dev tools
  - pip
  - pip:
    - pytest
    - pytest-cov
    - "mypy>=1.0.0"

# After creating the env:
#   conda activate qgis_dev
#   pip install -e ".[dev]"
#   python -m ipykernel install --user --name qgis_dev --display-name "Python (QGIS)"
